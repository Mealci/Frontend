name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  flutter-ci:
    name: Flutter CI
    # Skip CI on push if it's a merge commit from a PR
    if: github.event_name == 'pull_request' || github.event_name == 'push' && !contains(github.event.head_commit.message, 'Merge pull request')
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Configuration de Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.24.2'
        channel: 'stable'
    
    - name: Désactiver les animations CLI
      run: flutter config --no-cli-animations
    
    - name: Obtenir les dépendances
      run: |
        echo -e "\e[1;34m🔍 Obtention des dépendances...\e[0m"
        flutter pub get
        echo -e "\e[1;32m✅ Dépendances récupérées avec succès !\e[0m"

    - name: Analyser le code
      id: analyze
      if: github.event_name == 'pull_request'
      run: |
        echo -e "\e[1;34m🔎 Analyse du code...\e[0m"
        flutter analyze > flutter_analysis.txt || {
          echo "analyze_error=true" >> $GITHUB_OUTPUT
          echo "analysis_output<<EOF" >> $GITHUB_OUTPUT
          cat flutter_analysis.txt >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          exit 1
        }
        echo "analyze_error=false" >> $GITHUB_OUTPUT
        echo -e "\e[1;32m✅ Analyse terminée avec succès !\e[0m"

    - name: Formater le code
      if: github.event_name == 'push'
      run: |
        echo -e "\e[1;34m🖌️ Formatage du code...\e[0m"
        dart format --set-exit-if-changed .
        echo -e "\e[1;32m✅ Formatage terminé avec succès !\e[0m"
    
    - name: Exécuter les tests
      id: test
      run: |
        if [ -d "test" ] && [ "$(find test -name '*_test.dart' | wc -l)" -gt 0 ]; then
          echo -e "\e[1;34m🧪 Exécution des tests...\e[0m"
          flutter test || {
            echo "test_error=true" >> $GITHUB_OUTPUT
            exit 1
          }
          echo -e "\e[1;32m✅ Tests terminés avec succès !\e[0m"
        else
          echo -e "\e[1;33m⚠️ Aucun test trouvé\e[0m"
        fi

    - name: Commenter les résultats (PR uniquement)
      if: github.event_name == 'pull_request' && (failure() || success())
      uses: peter-evans/create-or-update-comment@v3
      with:
        issue-number: ${{ github.event.pull_request.number }}
        body: |
          ## Rapport CI ${{ success() && '✅' || '❌' }}
          
          ${{ steps.analyze.outputs.analyze_error == 'true' && format('### ❌ Erreurs d''analyse détectées\n```\n{0}\n```', steps.analyze.outputs.analysis_output) || '### ✅ Analyse du code réussie' }}
          
          ${{ steps.test.outputs.test_error == 'true' && '### ❌ Les tests ont échoué' || '### ✅ Tests réussis' }}