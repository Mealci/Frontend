name: mealci
description: "Mealci App"
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  http: ^1.2.2
  motion_tab_bar: ^2.0.4
  camera: ^0.11.0
  image_picker: ^1.1.2
  flutter_svg: ^2.0.16
  animated_text_kit: ^4.2.2
  google_maps_flutter: ^2.1.0
  geolocator: ^13.0.2
  flutter_dotenv: ^5.0.2
  calendar_timeline:
    git:
      url: https://github.com/Mealci/calendar_timeline.git
  health: ^12.0.1
  flutter_secure_storage: ^9.2.4
  confetti: ^0.8.0
  another_xlider: ^3.0.2
  flutter_xlider: ^3.5.0
  mobile_scanner: ^6.0.7
  shake: ^3.0.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/logo.png

    - assets/svg/profile_icon.svg # Profile Icon

    - assets/svg/fridge_icon.svg # Meal Icon

    - assets/svg/login_third_icon.svg # Third Party Login Icon

    - assets/svg/drink_icon.svg # Drink Icon
    - assets/svg/milk_icon.svg # Food Icon
    - assets/svg/fruit_icon.svg # Fruit Icon
    - assets/svg/cereal_icon.svg # Cereal Icon
    - assets/svg/vegetable_icon.svg # Vegetable Icon
    - assets/svg/starch_icon.svg # Feculent Icon
    - assets/svg/sugar_icon.svg # Sugar Icon
    - assets/svg/spicy_icon.svg # Spicy Icon
    - assets/svg/oil_icon.svg # Oil Icon
    - assets/svg/junk_food_icon.svg # Junk Food Icon
    - assets/svg/diet_icon.svg # Dietetic Food Icon
    - assets/svg/meat_icon.svg # Meat Icon
    - assets/svg/fish_icon.svg # Seafood Icon
    - assets/svg/toilet_icon.svg # Toilet Icon
    - assets/svg/min.svg # Min Icon
    - assets/svg/nutri-score-A.svg # Nutri Score A Icon
    - assets/svg/nutri-score-B.svg # Nutri Score B Icon
    - assets/svg/nutri-score-C.svg # Nutri Score C Icon
    - assets/svg/nutri-score-D.svg # Nutri Score D Icon
    - assets/svg/nutri-score-E.svg # Nutri Score E Icon
    - assets/svg/nova-group-1.svg # Nova Group 1 Icon
    - assets/svg/nova-group-2.svg # Nova Group 2 Icon
    - assets/svg/nova-group-3.svg # Nova Group 3 Icon
    - assets/svg/nova-group-4.svg # Nova Group 4 Icon
    - assets/svg/delete_icon.svg # Delete Icon
    - assets/svg/green_apple_icon.svg # Green Apple Icon
  fonts:
    - family: Voltaire
      fonts:
        - asset: assets/fonts/Voltaire.ttf
    - family: Designer
      fonts:
        - asset: assets/fonts/Designer.otf
