name: mealci
description: "Mealci App"
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.5.1

dependencies:
  flutter:
    sdk: flutter
  logging: ^1.3.0
  http: ^1.2.2
  motion_tab_bar: ^2.0.4
  google_ml_kit: ^0.18.0
  camera: ^0.11.0
  image_picker: ^0.8.4+4
  google_mlkit_text_recognition: ^0.13.1
  flutter_svg: ^2.0.16

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo.png
    - assets/svg/tst.svg
  fonts:
    - family: Voltaire
      fonts:
        - asset: assets/fonts/Voltaire.ttf
    - family: Designer
      fonts:
        - asset: assets/fonts/Designer.otf
